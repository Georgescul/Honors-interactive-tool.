<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gyrotron Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen workbench. Light 3D viewport (left) + data panel (right); stacks on phones.
   Deliberate single light theme in the project's teal palette. Content is shown as placeholder bars until the team fills it in. */
:root{
  --bg:#f2f6f4; --panel:#ffffff; --raise:#f6faf8; --line:#dae5e1;
  --ink:#587f74;            /* body text (brand) */
  --head:#70a598;           /* headings and highlights (brand) */
  --ink-soft:#7d9a92;
  --accent:#70a598; --accent-soft:#e4f0ec; --on-accent:#ffffff;
  --stage-hi:#ffffff; --stage-lo:#e4ece9; --on-stage:#587f74; --on-stage-soft:#7d9a92; --glass:rgba(255,255,255,.88); --glass-line:#d3dfdb;
  --sk:#e6ecea; --sk-dot:#a7bbb5;
  --risk-low:#2f8a58; --risk-medium:#b8820f; --risk-high:#cc5a24; --risk-critical:#b02a33; --risk-unknown:#8a9a96;
  --role-maker:#3f6e8c; --role-material:#c58b32; --role-research:#8b6fb0; --role-brainport:#70a598;
  --map-bg:#f3f8f6; --map-dot:#b9cfc8;
  --f-head:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:400}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;color:var(--head);margin:0;text-wrap:balance}
.lbl-s{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:40px;width:auto;flex:none}
.brand .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
h1{font-size:28px;line-height:1.05;letter-spacing:-.005em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{cursor:not-allowed;color:var(--ink-soft);font-weight:600}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:9px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:700}
.btn:hover{filter:brightness(.95)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* workbench */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 16px var(--side-w,400px);gap:0}
.stage{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 30%,var(--stage-hi),var(--stage-lo));color:var(--on-stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage canvas.pointing{cursor:pointer}

.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tool{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--glass-line);background:var(--glass);color:var(--on-stage);
  border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13.5px;font-weight:600;backdrop-filter:blur(6px)}
.tool:hover{border-color:var(--on-stage-soft)}
.tool[aria-pressed="true"],.tool[aria-checked="true"]{border-color:var(--accent);background:rgba(112,165,152,.22)}
.tool .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.tool[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.track{width:28px;height:16px;border-radius:8px;background:#c9d8d3;position:relative;flex:none;transition:background .2s}
.knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.tool[aria-checked="true"] .track{background:#f07a1a}
.tool[aria-checked="true"] .knob{transform:translateX(12px);background:#fff}
.legend{position:absolute;right:12px;top:56px;display:flex;flex-direction:column;gap:4px;background:var(--glass);border:1px solid var(--glass-line);border-radius:9px;padding:8px 10px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}

.foot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.foot-l{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cta{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:9px 16px 9px 12px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 6px 18px rgba(40,70,62,.22)}
.cta svg{width:18px;height:18px}
.hint{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--on-stage-soft)}
.plate{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.plate span{font-size:11.5px;font-weight:600;background:var(--glass);border:1px solid var(--glass-line);border-radius:5px;padding:2px 8px;color:var(--on-stage-soft);font-variant-numeric:tabular-nums}

.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-family:var(--f-head);font-weight:700;font-size:13.5px;color:var(--on-stage);border:0;background:none;padding:0;transition:opacity .2s}
.lbl::before{content:"";width:18px;height:1px;background:var(--on-stage-soft)}
.lbl.left{flex-direction:row-reverse}
.lbl.up,.lbl.down{flex-direction:column;gap:0}
.lbl.up{flex-direction:column-reverse}
.lbl.up::before,.lbl.down::before{width:1px;height:14px}
.lbl span{background:var(--glass);border:1px solid var(--glass-line);border-radius:5px;padding:1px 7px}
.lbl.on span{background:var(--accent);border-color:var(--accent);color:#fff}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.3;max-width:250px;box-shadow:0 6px 20px rgba(40,70,62,.18);border:1px solid var(--line)}
.tip b{color:var(--head)}
.tip small{display:block;font-size:11.5px;margin-top:2px}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(40,70,62,.18);border:1px solid var(--line)}
.drop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(242,246,244,.88);border:3px dashed var(--accent);font-family:var(--f-head);font-size:26px;font-weight:700;color:var(--head)}

/* tour card */
.tour{position:absolute;left:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--panel);color:var(--ink);border-radius:14px;padding:14px 16px 12px;
  box-shadow:0 10px 30px rgba(40,70,62,.2);border:1px solid var(--line);display:grid;gap:8px}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tour h3{font-size:21px;line-height:1.15}
.tour p{margin:0;font-size:14.5px}
.tour-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.tour-nav button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;color:var(--ink)}
.tour-nav button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tour-nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.x{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-soft);padding:2px 4px}

/* panel */
.panel{min-height:0;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-size:28px;line-height:1.08}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.panel p{margin:0}
.lead{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--raise)}
.chip .sw{border-radius:50%}
.chip.dash{border-style:dashed}
.chip.ok{background:var(--accent-soft);border-color:var(--accent)}
dl{margin:0;display:grid;gap:12px}
dl div{display:grid;gap:2px}
dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--head)}
dd{margin:0}
.specs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.specs dt{padding-top:2px}
.callout{border-left:4px solid var(--rc,var(--risk-unknown));background:var(--raise);border-radius:0 9px 9px 0;padding:10px 12px}
.bp{background:var(--accent-soft);border-radius:9px;padding:10px 12px;display:grid;gap:4px}
.src{font-size:12.5px;overflow-wrap:anywhere}
.warn{color:var(--risk-high);font-weight:700}
.back{align-self:flex-start;border:0;background:none;padding:0;cursor:pointer;font-size:13px;font-weight:700;color:var(--head)}
.pager{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.pager button{border:0;background:none;cursor:pointer;color:var(--head);font-weight:700;padding:0;text-align:left}
.pager button:last-child{text-align:right}
.list{display:grid;gap:3px;margin:0;padding:0;list-style:none}
.row{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.row:hover,.row.hot{background:var(--raise);border-color:var(--line)}
.row .sw{width:12px;height:12px;border-radius:50%}
.row b{font-weight:700;display:block;color:var(--ink)}
.row small{font-size:12px;color:var(--ink-soft)}
.row .st{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.bar-risk{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.bar-risk i{display:block;height:100%}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.counts span{display:inline-flex;align-items:center;gap:6px}
.datasrc{font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--head);cursor:pointer;font-weight:700;text-align:left}

/* map */
.map{margin:0;display:grid;gap:8px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.map-head h3{margin:0}
.map .land{stroke:var(--map-dot);stroke-linecap:round;fill:none}
.map .arc{fill:none;stroke-width:1.2;opacity:.55;stroke-dasharray:3 3}
.map .m{stroke:#fff;transform-box:fill-box;transform-origin:center;transition:transform .15s}
.map .m.on{transform:scale(1.9)}
.map .home{fill:none;stroke:var(--head)}
.map .hl{fill:var(--head);font-family:var(--f-head);font-weight:700;paint-order:stroke;stroke:var(--map-bg);stroke-linejoin:round}
.locs{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13px}
.locs li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 6px;border-radius:6px}
.locs li:hover{background:var(--raise)}
.locs .sw{border-radius:50%;transform:translateY(1px)}
.locs b{font-weight:700}
.locs small{color:var(--ink-soft);font-size:12px}
.locs em{font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}

/* resizable split between the model and the side panel */
.split{position:relative;cursor:col-resize;display:grid;place-items:center;touch-action:none;user-select:none;outline:none}
.split::before{content:"";position:absolute;inset:0 -3px}
.split span{width:4px;height:44px;border-radius:2px;background:#c9d8d3;transition:height .2s,width .2s,background .2s}
.split:hover span,.split.on span,.split:focus-visible span{background:var(--accent);height:96px;width:5px}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
body.resizing .stage canvas,body.resizing .panel{pointer-events:none}

/* structured text built from the spreadsheet */
.rt{display:grid;gap:8px}
.rt ul,.rt ol{margin:0;padding-left:18px;display:grid;gap:6px}
.rt li::marker{color:var(--head);font-weight:700}
.rt b{font-weight:700;color:var(--head)}
.rt-h{font-weight:700;color:var(--head);font-size:13.5px;margin-bottom:-2px!important}
.lead .rt{gap:6px}
.kv{display:grid!important;grid-template-columns:fit-content(44%) minmax(0,1fr);gap:0!important;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:13.5px;line-height:1.4}
.kv > div{display:contents!important}
.kv dt,.kv dd{padding:6px 10px;border-top:1px solid var(--line)}
.kv > div:first-child dt,.kv > div:first-child dd{border-top:0}
.kv dt{background:var(--raise);font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--head);padding-top:7px}
.kv .sep{color:var(--ink-soft);padding:0 2px}
.kvbar{display:block;height:4px;border-radius:2px;background:var(--accent-soft);margin-top:5px;overflow:hidden}
.kvbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.fields > div > dd{min-width:0}

/* citations and organisation mentions */
sup.cite{font-size:.7em;line-height:0;vertical-align:super;white-space:nowrap;margin-left:1px}
.cref{text-decoration:none;border:0;background:var(--accent-soft);color:var(--head);font:inherit;font-weight:800;line-height:1.35;padding:0 3px;margin:0 1px;border-radius:3px;cursor:pointer}
.cref:hover,.cref:focus-visible{background:var(--accent);color:#fff}
.cref.miss{background:var(--sk);color:var(--ink-soft)}
.ctip{position:fixed;left:0;top:0;z-index:50;max-width:340px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(40,70,62,.2);pointer-events:none}
.ctip b{color:var(--head)}
.ctip .ctn{display:inline-block;font-weight:800;color:#fff;background:var(--head);border-radius:4px;padding:0 5px;margin-right:6px;font-size:11px}
.ctip span{color:var(--ink-soft)}
.org{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--oc,var(--accent));text-decoration-thickness:2px;text-underline-offset:3px;border-radius:3px}
.org:hover,.org:focus-visible{background:var(--accent-soft)}

/* subsystems and short lists */
.subwrap{display:grid;gap:6px}
.subwrap .lbl-s{display:flex;align-items:center;gap:6px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent-soft);color:var(--head);font-size:10.5px;font-weight:800;letter-spacing:0}
.subs{display:flex;flex-wrap:wrap;gap:4px}
.sub{display:inline-flex;align-items:baseline;gap:3px;font-size:12px;line-height:1.3;padding:3px 8px;border-radius:6px;background:var(--raise);border:1px solid var(--line);color:var(--ink);font-weight:600}
.sub small{color:var(--ink-soft);font-size:11px;font-weight:400}
.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Brainport block */
.bp{gap:8px}
.bp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bp-top h3{margin:0}
.bp .chip.verdict{background:var(--panel);border-color:var(--vc)}
.bp-what{display:grid;gap:4px;border-top:1px solid rgba(112,165,152,.35);padding-top:8px}

/* open questions */
.qs{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:q}
.qs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:14px;line-height:1.45}
.qs li::before{counter-increment:q;content:"Q" counter(q);font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--head);border-radius:5px;padding:1px 6px;margin-top:2px}
.qnote{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:6px!important}

/* sources */
details.refs{border:1px solid var(--line);border-radius:10px;background:var(--raise)}
details.refs > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px}
details.refs > summary::-webkit-details-marker{display:none}
details.refs > summary h3{margin:0}
details.refs > summary .hint2{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11.5px;color:var(--ink-soft)}
details.refs > summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--head);border-bottom:2px solid var(--head);transform:rotate(45deg) translateY(-2px);transition:transform .2s;margin-left:auto}
details.refs[open] > summary::after{transform:rotate(-135deg) translateY(-1px)}
details.refs > summary:hover{background:var(--accent-soft)}
.reflist{list-style:none;margin:0;padding:0 6px 8px;display:grid;gap:1px;font-size:12px;line-height:1.38}
.reflist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;padding:5px 6px;border-radius:6px;scroll-margin:40px}
.reflist li:hover{background:var(--panel)}
.reflist li.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.reflist .rn{font-weight:800;color:var(--head);text-align:right;font-variant-numeric:tabular-nums}
.reflist .rti{font-weight:700;color:var(--ink)}
.reflist .rm{color:var(--ink-soft);font-size:11.5px}
.reflist .rl{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:2px;vertical-align:1px}
.reflist .rl a{font-size:10px;font-weight:800;letter-spacing:.02em;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 5px;color:var(--head);text-decoration:none;line-height:1.5}
.reflist .rl a:hover{border-color:var(--accent);background:var(--accent-soft)}
.reflist li.note{color:var(--ink-soft);font-style:italic}

/* map thumbnail that opens the big map */
.map .mapsvg{display:block;width:100%;max-width:100%;height:auto;background:var(--map-bg);border-radius:10px;border:1px solid var(--line);transition:border-color .2s}
.map-open{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;color:inherit}
.map-open:hover .mapsvg{border-color:var(--accent)}
.zoomhint{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:3px 10px 3px 8px;color:var(--head);transition:transform .2s,background .2s,color .2s}
.map-open:hover .zoomhint,.map-open:focus-visible .zoomhint{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px)}
.map-x{font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.locs li{cursor:pointer}
.locs li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.locs .pn{display:block;font-size:11px;color:var(--head);font-weight:700}

/* big zoomable map */
.mbox{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:clamp(8px,2.5vw,28px)}
.mbox-bg{position:absolute;inset:0;background:rgba(36,62,55,.4);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s}
.mbox.open .mbox-bg{opacity:1}
.mcard{position:relative;width:min(1240px,100%);height:min(800px,100%);background:var(--panel);border-radius:16px;box-shadow:0 24px 70px rgba(30,55,48,.35);display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);overflow:hidden;transform-origin:0 0}
.mtop{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.mtop .mtt{display:grid;gap:1px;margin-right:auto;min-width:0}
.mtop h2{font-size:22px;line-height:1.15}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend .sw{border-radius:50%}
.mlegend .hm{width:10px;height:10px;border-radius:50%;border:2px solid var(--head)}
.mview{position:relative;overflow:hidden;background:var(--map-bg);cursor:grab;touch-action:none;outline:none}
.mview.dragging{cursor:grabbing}
.mview.pointing{cursor:pointer}
.mview canvas,.mview > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mview > svg{pointer-events:none;overflow:visible}
.mview .marc{fill:none;stroke-width:1.5;stroke-dasharray:4 4;opacity:.5}
.mview .marc.on{opacity:.95;stroke-width:2.2;stroke-dasharray:none}
.mview .mm{stroke:#fff;stroke-width:2.2;transition:r .15s}
.mview .mm.on{stroke-width:3;filter:drop-shadow(0 2px 4px rgba(30,55,48,.35))}
.mview .mlead{stroke:var(--ink-soft);stroke-width:1;opacity:.7}
.mview .mhome{fill:rgba(112,165,152,.15);stroke:var(--head);stroke-width:2}
.mlbls{position:absolute;inset:0;pointer-events:none}
.mlbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11.5px;font-weight:700;line-height:18px;padding:0 7px;border-radius:5px;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.mlbl.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mlbl.home{color:var(--head);border-color:var(--head)}
.mtip{position:absolute;left:0;top:0;width:min(280px,70%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.4;box-shadow:0 10px 28px rgba(30,55,48,.22);pointer-events:none;display:grid;gap:3px}
.mtip b{color:var(--head);font-size:13.5px}
.mtip small{color:var(--ink-soft)}
.mzoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid var(--glass-line);background:var(--glass);border-radius:10px;overflow:hidden;backdrop-filter:blur(6px)}
.mzoom button{width:34px;height:34px;border:0;background:none;cursor:pointer;font-size:18px;font-weight:700;color:var(--head);display:grid;place-items:center}
.mzoom button + button{border-top:1px solid var(--glass-line)}
.mzoom button:hover{background:var(--accent-soft)}
.mscale{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;color:var(--ink-soft);pointer-events:none}
.mscale i{display:block;height:6px;border:2px solid var(--ink-soft);border-top:0}
.mhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11.5px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:3px 12px;color:var(--ink-soft);pointer-events:none;white-space:nowrap}
.mside{border-left:1px solid var(--line);overflow:auto;padding:10px;display:grid;align-content:start;gap:6px}
.mlocs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mrow{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:baseline;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:7px 9px;cursor:pointer;color:var(--ink);font-size:13px;line-height:1.35}
.mrow:hover,.mrow.on{background:var(--raise);border-color:var(--line)}
.mrow.sel{background:var(--accent-soft);border-color:var(--accent)}
.mrow .sw{border-radius:50%;transform:translateY(1px)}
.mrow b{display:block;color:var(--ink)}
.mrow small{display:block;font-size:12px;color:var(--ink-soft)}
.mrow .mnote{margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow.sel .mnote{-webkit-line-clamp:unset;display:block}
.mrow em{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.mempty{margin:6px;font-size:13px;color:var(--ink-soft)}
@media (max-width:760px){
  .mcard{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 36%}
  .mside{border-left:0;border-top:1px solid var(--line)}
  .mhint{display:none}
  .mtop{padding-right:48px}
  .mtop #mClose{position:absolute;right:10px;top:10px}
}

/* placeholder bars */
.sk{display:grid;gap:7px;padding-top:4px}
.sk i{display:block;height:9px;border-radius:5px;background:var(--sk)}
.lead .sk i{height:11px}
.skl{display:inline-block;height:8px;border-radius:4px;background:var(--sk);vertical-align:middle}
.chip.blank{min-width:118px;color:transparent}
.chip.blank .sw{background:var(--sk-dot)!important}
.callout.blank{--rc:var(--sk-dot)}
.tour .sk{padding-top:2px}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr);gap:12px}
  .split{display:none}
  .stage{height:68vh;min-height:420px}
  .stage canvas{touch-action:pan-y}
  .panel{overflow:visible}
  h1{font-size:24px}
  .brand img{height:34px}
}
@media (max-width:640px){ .plate{display:none} .hint span:last-child{display:none} }
@media (prefers-reduced-motion:reduce){ .lbl,.track,.knob,.map .m,.split span,.zoomhint,.mbox-bg{transition:none} .reflist li.flash{animation:none;background:var(--accent-soft)} }
</style>

const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// gyrating electrons
const NE = 1300, Y0 = 2.3, Y1 = 16.2, VE = 2.1;
const BEAM_RL = [[2.3,.015],[4.8,.055],[6.6,.055],[10,.085],[16.2,.15]];
const BEAM_W = [[2.3,7],[4.8,28],[6.6,28],[10,14],[16.2,5]];
const ey = new Float32Array(NE), ephi = new Float32Array(NE), epsi = new Float32Array(NE);
const ePos = new Float32Array(NE*3), eCol = new Float32Array(NE*3), eA = new Float32Array(NE);
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute("position", new THREE.BufferAttribute(ePos,3));
eGeo.setAttribute("color", new THREE.BufferAttribute(eCol,3));
eGeo.setAttribute("alpha", new THREE.BufferAttribute(eA,1));
const eMat = new THREE.ShaderMaterial({
  uniforms:{uOpacity:{value:0}, uSize:{value:.065}, uScale:{value:500}},
  vertexShader:`attribute vec3 color; attribute float alpha; varying vec3 vC; varying float vA; uniform float uSize,uScale;
    void main(){ vC = color; vA = alpha; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = uSize*uScale/-mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`varying vec3 vC; varying float vA; uniform float uOpacity;
    void main(){ float d = length(gl_PointCoord-0.5); float a = smoothstep(0.5,0.25,d); gl_FragColor = vec4(vC, a*vA*uOpacity); }`,
  transparent:true, depthWrite:false});
const electrons = new THREE.Points(eGeo, eMat); electrons.frustumCulled = false; ROOT.add(electrons);
function seedElectrons(){ for (let i=0;i<NE;i++){ ey[i] = Y0 - Math.random()*(Y1-Y0); ephi[i] = Math.random()*Math.PI*2; epsi[i] = Math.random()*Math.PI*2; } }
seedElectrons();
const C_HOT = [0.03,0.50,0.80], C_SPENT = [0.48,0.63,0.78];
function stepElectrons(dt){
  for (let i=0;i<NE;i++){
    let y = ey[i] + VE*dt;
    if (y > Y1){ y = Y0 - Math.random()*.25; ephi[i] = Math.random()*Math.PI*2; }
    ey[i] = y; epsi[i] += table(BEAM_W, y)*dt;
    const j = i*3;
    if (y < Y0){ eA[i] = 0; continue; }
    const R = table(BEAM_R, y), rl = table(BEAM_RL, y), sp = Math.sin(ephi[i]), cp = Math.cos(ephi[i]), cs = Math.cos(epsi[i]), sn = Math.sin(epsi[i]);
    ePos[j] = R*sp + rl*(cs*sp + sn*cp); ePos[j+1] = y; ePos[j+2] = R*cp + rl*(cs*cp - sn*sp);
    const s = sstep(5.0, 6.6, y);
    eA[i] = (.95 - .4*s) * sstep(Y0, Y0+.3, y) * (1 - sstep(Y1-.6, Y1, y)*.7);
    eCol[j] = C_HOT[0]+(C_SPENT[0]-C_HOT[0])*s; eCol[j+1] = C_HOT[1]+(C_SPENT[1]-C_HOT[1])*s; eCol[j+2] = C_HOT[2]+(C_SPENT[2]-C_HOT[2])*s;
  }
  eGeo.attributes.position.needsUpdate = true; eGeo.attributes.color.needsUpdate = true; eGeo.attributes.alpha.needsUpdate = true;
}

// gyrotron beam update, called every frame while the gyrotron tab is active
function gyroBeam(dt, e){
  if (beamOn || beamVis > .01) stepElectrons(dt);
  for (const m of [rfMat, cavMat, lauMat]) m.uniforms.uTime.value = clock;
  cavMat.uniforms.uOpacity.value = beamVis * sstep(1.2, 1.8, tau);
  lauMat.uniforms.uOpacity.value = beamVis * sstep(1.7, 2.3, tau);
  rfMat.uniforms.uOpacity.value = beamVis;
  rfMat.uniforms.uHead.value = clamp((tau-2.2)/1.3, 0, 1.05);
  electrons.visible = cavGlow.visible = lauGlow.visible = rfBeam.visible = beamVis > .01;
  const gv = beamOn ? 0 : 1 - e;
  guideMat.opacity = .25*gv; guideRfMat.opacity = .7*gv; guideE.visible = guideRf.visible = gv > .02;
}

/* ================================================================
   Free-electron maser (FEM)
   A horizontal beamline along x: gun -> accelerator -> beam transport -> wiggler with the
   interaction structure inside it -> output mirror (microwaves turn up through the window) ->
   collector. Pumps of the vacuum system hang underneath. Schematic, not to scale.
   Taking it apart moves parts up and down instead of sideways.
   ================================================================ */

document.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("cref")) ctip.hidden = true; });
$("#panel").addEventListener("click", e => {
  const c = e.target.closest(".cref"); if (c){ e.preventDefault(); e.stopPropagation(); ctip.hidden = true; jumpRef(+c.dataset.ref); return; }
  const o = e.target.closest(".org"); if (o && CURMAP) mOpen(CURMAP, +o.dataset.loc, thumbOf(panel, CURMAP));
});
$("#panel").addEventListener("pointerover", e => { const o = e.target.closest(".org"); if (o && CURMAP) markOn(panel, CURMAP, o.dataset.loc, true); });
$("#panel").addEventListener("pointerout", e => { const o = e.target.closest(".org"); if (o && CURMAP) markOn(panel, CURMAP, o.dataset.loc, false); });
$("#panel").addEventListener("scroll", () => { ctip.hidden = true; }, {passive:true});

function uniqueLocs(){
  const seen = new Map();
  for (const l of DATA.locations || []){ const k = (l.org + "|" + l.city).toLowerCase(); if (!seen.has(k)) seen.set(k, l); }
  return [...seen.values()];
}

/* ---------- panel ---------- */
const panel = $("#panel");
function order(){ const ids = DATA.parts.map(p => p.part_id); for (const id in P) if (!ids.includes(id)) ids.push(id); return ids; }
function chip(cls, color, text){ return `<span class="chip ${cls}">${color ? `<span class="sw" style="background:var(${color})"></span>` : ""}${esc(text)}</span>`; }
const exampleCo = n => `<span class="chips">${Array.from({length:n}, () => `<span class="chip">Example company</span>`).join("")}</span>`;
function riskSummary(){
  if (!DATA.parts.some(p => RISKS.includes(p.risk)))
    return `<div class="bar-risk" aria-hidden="true">${DATA.parts.map(() => `<i style="flex:1;background:var(--sk)"></i>`).join("")}</div>`;
  const n = {}; DATA.parts.forEach(p => { const r = RISKS.includes(p.risk) ? p.risk : "Unknown"; n[r] = (n[r]||0)+1; });
  const keys = [...RISKS, "Unknown"].filter(k => n[k]);
  return `<div class="bar-risk" role="img" aria-label="${keys.map(k=>n[k]+" "+k).join(", ")}">${keys.map(k => `<i style="flex:${n[k]};background:var(${riskVar(k)})"></i>`).join("")}</div>
    <div class="counts">${keys.map(k => `<span><span class="sw" style="background:var(${riskVar(k)})"></span>${n[k]} ${k.toLowerCase()}</span>`).join("")}</div>`;
}
function renderOverview(){
  const d = byId(), locs = uniqueLocs(); REFS = {}; ORGS = null; CURMAP = null;
  const map = locs.length ? mapFigure(locs, "Where the parts come from", {parts:true})
    : mapFigure(mockSpots("overview", 3), "Where the parts come from", {mock:true, list:
        `<ul class="locs">${[0,1,2].map(i => `<li><span class="sw" style="background:var(--sk-dot)"></span><span><b>Example company</b> ${skl(70 + i*14)}</span>${skl(44)}</li>`).join("")}</ul>`});
  panel.innerHTML = `
    <div style="display:grid;gap:2px"><span class="lbl-s">Device overview</span><h2>${esc((DATA.device.find(x=>/^device$/i.test(x.field))||{}).value || cur.title)}</h2></div>
    <dl class="specs">${DATA.device.filter(x=>!/^device$/i.test(x.field)).map(x => `<dt>${esc(x.field)}</dt><dd>${x.value ? esc(x.value) + (x.source ? ` <span class="src">(${esc(x.source)})</span>` : "") : /maker|compan/i.test(x.field) ? exampleCo(3) : sk(1, "dev" + x.field)}</dd>`).join("")}</dl>
    <div><h3>Supply risk across ${DATA.parts.length} components</h3>${riskSummary()}</div>
    <div><h3>Components</h3><ul class="list">${order().map(id => { const p = d[id] || {};
      return `<li><button class="row" data-id="${esc(id)}" type="button"><span class="sw" style="background:var(${riskVar(p.risk)})"></span>
        <span style="min-width:0"><b>${esc(p.name || id)}</b><small>${p.subsystem ? esc(subSummary(p.subsystem)) : skl(60 + hash(id) % 50)}${P[id] ? "" : " · no 3D shape yet"}</small></span>
        <span class="st">${esc(p.status || "")}</span></button></li>`; }).join("")}</ul></div>
    ${map}
    <div class="datasrc"><span>${esc(dataLabel)}</span>
      ${loadedName ? `<button class="linkbtn" id="reset" type="button">Go back to the empty mock-up</button>` : ""}</div>`;
  panel.querySelectorAll(".row").forEach(b => { b.addEventListener("click", () => select(b.dataset.id)); b.addEventListener("pointerenter", () => setHover(b.dataset.id)); b.addEventListener("pointerleave", () => setHover(null)); });
  const r = $("#reset"); if (r) r.addEventListener("click", resetData);
  wireMaps(panel); markRows(); panel.scrollTop = 0; ctip.hidden = true;
}
function renderPart(id){
  const p = byId()[id] || {part_id:id, name:id}, ids = order(), i = ids.indexOf(id);
  const prev = ids[(i-1+ids.length)%ids.length], next = ids[(i+1)%ids.length], nm = x => esc((byId()[x]||{}).name || x);
  const back = tour !== null ? "← Exit walkthrough" : "← All components";
  const locs = locsFor(id).filter(l => isFinite(l.lat) && isFinite(l.lon));
  // context for citations and organisation links in this part's text
  const refs = parseRefs(p.sources); REFS = {};
  refs.forEach(r => { if (r.n === null) return; const b = refParts(r.text);
    REFS[r.n] = `<b>${esc(b.ti)}</b>${b.au ? `<br><span>${esc(b.au)}</span>` : ""}${b.rest ? `<br><span>${esc(b.rest)}</span>` : ""}`; });
  ORGS = buildOrgs(locs);
  const o = {};
  const field = (label, v, n) => { const ch = v && asChips(v);
    return `<div><dt>${label}</dt><dd>${!v ? sk(n, id + label) : ch ? `<span class="subs">${ch.map(x => itemChip(x, o)).join("")}</span>` : rich(v, o)}</dd></div>`; };
  const subs = splitItems(p.subsystem), kick = subs.length === 1 && bareItem(subs[0]).length < 40 ? cap1(bareItem(subs[0])) : "";
  const map = locs.length ? mapFigure(locs, "Where it comes from", {full:`${p.name || id}: where it comes from`})
    : mapFigure(mockSpots(id, 3 + hash(id) % 3), "Where it comes from", {mock:true, full:`${p.name || id}: where it comes from`});
  CURMAP = locs.length ? mapFigure.last : null;
  const risk = RISKS.includes(p.risk) ? chip("", riskVar(p.risk), p.risk + " supply risk") : `<span class="chip blank" aria-hidden="true"><span class="sw"></span>&nbsp;</span>`;
  const v = verdictOf(p.brainport);
  panel.innerHTML = `
    <button class="back" id="back" type="button">${back}</button>
    <div style="display:grid;gap:8px"><span class="lbl-s">${kick ? esc(kick) : p.subsystem ? `Component ${i + 1} of ${ids.length}` : skl(96)}</span><h2>${esc(p.name || id)}</h2>
      <div class="chips">${risk}${p.status ? chip(p.status === "Confirmed" ? "ok" : "", "", p.status) : ""}${P[id] ? "" : chip("", "", "No 3D shape yet")}</div></div>
    ${subs.length > 1 ? `<div class="subwrap"><span class="lbl-s">Subsystems <span class="cnt">${subs.length}</span></span><div class="subs">${subs.map(x => itemChip(x, o)).join("")}</div></div>` : ""}
    ${p.function ? leadBlock(p.function, o) : `<p class="lead">${sk(2, id + "lead")}</p>`}
    <dl class="fields">${field("Material", p.material, 2)}${field("Key specs", p.specs, 2)}${field("Who makes it today", p.makers, 1)}</dl>
    ${p.tech ? `<div><h3>Technology status</h3>${rich(p.tech, o)}</div>` : ""}
    <div class="callout${p.issue ? "" : " blank"}" style="--rc:var(${riskVar(p.risk)})"><h3>Supply-chain problem</h3>${p.issue ? rich(p.issue, o) : `<p>${sk(2, id + "issue")}</p>`}</div>
    ${map}
    <div class="bp"><div class="bp-top"><h3>Brainport angle</h3>${v && v.label ? `<span class="chip verdict" style="--vc:var(${v.tone})"><span class="sw" style="background:var(${v.tone})"></span>${esc(v.label)}</span>` : ""}</div>
      ${v && v.rest ? rich(v.rest, o) : ""}
      ${p.brainport_role ? `<div class="bp-what"><span class="lbl-s">What Brainport could contribute</span>${rich(p.brainport_role, o)}</div>` : ""}
      ${!p.brainport && !p.brainport_role ? `<p>${sk(2, id + "bp")}</p>` : ""}</div>
    <div><h3>Open questions</h3>${p.notes ? questions(p.notes, o) : `<p>${sk(2, id + "notes")}</p>`}</div>
    ${refsBlock(p, refs)}
    ${tour === null ? `<div class="pager"><button type="button" data-go="${esc(prev)}">← ${nm(prev)}</button><button type="button" data-go="${esc(next)}">${nm(next)} →</button></div>` : ""}`;
  $("#back").addEventListener("click", () => tour !== null ? endTour() : select(null));
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)));
  wireMaps(panel); panel.scrollTop = 0; ctip.hidden = true;
}
function markRows(){ panel.querySelectorAll(".row").forEach(r => r.classList.toggle("hot", r.dataset.id === hovered)); }
function select(id){
  if (tour !== null) endTour(true);
  if (id !== selected) zoom = 1;
  selected = id; if (id) latch = true;
  applyLook(); id ? renderPart(id) : renderOverview(); syncChrome();
}

/* ---------- beam + walkthrough controls ---------- */
const btnBeam = $("#btnBeam");
function setBeam(on){
  if (on === beamOn) return;
  beamOn = on; btnBeam.setAttribute("aria-checked", on);
  if (on){ tau = 0; cur.seed(); latch = false; if (!selected) faceCut(cur.beamElev); }
  else if (tour !== null) endTour();
  syncChrome();
}
btnBeam.addEventListener("click", () => setBeam(!beamOn));
function startTour(){ selected = null; latch = false; setBeam(true); tour = -1; goStep(0); }
function goStep(i){
  if (tour === null) return;
  i = clamp(i, 0, STEPS.length-1); if (i === tour) return;
  tour = i; zoom = 1; const s = STEPS[i];
  thetaGoal = theta + Math.atan2(Math.sin(TH0 - theta), Math.cos(TH0 - theta)); elevGoal = s.el;
  $("#tStep").textContent = `Follow the microwave · step ${i+1} of ${STEPS.length}`;
  $("#tTitle").textContent = s.title; $("#tText").innerHTML = s.text ? esc(s.text) : sk(3, "tour" + i);
  $("#tPrev").disabled = i === 0; $("#tNext").textContent = i === STEPS.length-1 ? "Finish" : "Next";
  $("#tDots").innerHTML = STEPS.map((_,k) => `<i class="${k === i ? "on" : ""}"></i>`).join("");
  applyLook(); s.panel ? renderPart(s.panel) : renderOverview(); syncChrome();
}
function endTour(quiet){ if (tour === null) return; tour = null; thetaGoal = null; applyLook(); if (!quiet){ renderOverview(); } syncChrome(); }
function syncChrome(){
  $("#tour").hidden = tour === null; $("#foot").hidden = tour !== null;
  $("#hint").innerHTML = beamOn ? `<span>Beam on: the ${cur.noun} stays together while you watch</span><span>Click a part to take it apart and zoom in</span>`
    : `<span>Hover the ${cur.noun} to take it apart</span><span>Click a part to zoom in</span><span>Drag to rotate</span><span>Scroll to zoom</span>`;
  $("#hint").hidden = !!selected;
}
$("#btnTour").addEventListener("click", startTour);
$("#tNext").addEventListener("click", () => tour === STEPS.length-1 ? endTour() : goStep(tour+1));
$("#tPrev").addEventListener("click", () => goStep(tour-1));
$("#tClose").addEventListener("click", () => endTour());

$("#btnApart").addEventListener("click", e => { pinned = !pinned; e.currentTarget.setAttribute("aria-pressed", pinned); if (!pinned) latch = false; if (pinned && tour !== null) endTour(); });
$("#btnRisk").addEventListener("click", e => { riskMode = !riskMode; e.currentTarget.setAttribute("aria-pressed", riskMode); $("#legend").hidden = !riskMode; applyLook(); });
$("#legend").innerHTML = RISKS.map(r => `<div><span class="sw" style="background:var(${riskVar(r)})"></span>${r}</div>`).join("");

/* ---------- spreadsheet import ---------- */
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 5000); }
function norm(h){ return String(h||"").trim().toLowerCase().replace(/\s+/g," "); }
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : NaN; };
// part ids are matched loosely: case, spaces, punctuation and small typos are ignored ("Vaccum System" -> vacuum)
const idKey = v => String(v ?? "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
function lev(a, b){ const m = a.length, n = b.length; let p = Array.from({length:n+1}, (_,j) => j);
  for (let i=1;i<=m;i++){ const q = [i]; for (let j=1;j<=n;j++) q[j] = Math.min(p[j]+1, q[j-1]+1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = q; } return p[n]; }
function resolveId(dev, ...cands){
  for (const c of cands){ const k = idKey(c); if (!k) continue;
    for (const id in dev.aliases) if (dev.aliases[id].includes(k)) return id; }
  for (const c of cands){ const k = idKey(c), tol = k.length >= 8 ? 2 : k.length >= 5 ? 1 : 0; if (!tol) continue;
    let best = null, bd = tol + 1;
    for (const id in dev.aliases) for (const a of dev.aliases[id]){ const d = lev(k, a); if (d < bd){ bd = d; best = id; } }
    if (best) return best; }
  return null;
}
const cell = (r, name) => { for (const k in r) if (norm(k) === name) return String(r[k]).trim(); return ""; };
function parseBook(wb, dev){
  const sn = wb.SheetNames.find(n => /^parts$/i.test(n)) || wb.SheetNames.find(n => /part/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:""});
  const parts = rows.map(r => { const o = {}; for (const k in r){ const f = HEAD[norm(k)]; if (f) o[f] = String(r[k]).trim(); } return o; }).filter(o => o.part_id);
  if (!parts.length) throw new Error("No rows with a part_id found. Keep the headers from the template, including the part_id column.");
  // is this the other device's sheet?
  const hits = d => parts.filter(p => resolveId(d, p.part_id, p.name)).length;
  const other = Object.values(DEV).find(d => d !== dev);
  if (hits(other) > hits(dev)){ const e = new Error(`This looks like the ${other.sheet} spreadsheet. Open the ${other.title} tab and load it there.`); e.wrongSheet = true; throw e; }
  parts.forEach(p => { const id = resolveId(dev, p.part_id, p.name); if (id) p.part_id = id; p.risk = cap(p.risk); p.status = cap(p.status); p.name = p.name || p.part_id; });
  let device = DATA.device, locations = [], skipped = 0;
  const ds = wb.SheetNames.find(n => /^device$/i.test(n));
  if (ds){ const dr = XLSX.utils.sheet_to_json(wb.Sheets[ds], {defval:""}).map(r => ({field:cell(r,"field"), value:cell(r,"value"), source:cell(r,"source")})).filter(r => r.field); if (dr.length) device = dr; }
  const ls = wb.SheetNames.find(n => /^locations?$/i.test(n));
  if (ls){
    XLSX.utils.sheet_to_json(wb.Sheets[ls], {defval:""}).forEach(r => {
      const o = {}; for (const k in r){ const f = LHEAD[norm(k)]; if (f) o[f] = String(r[k]).trim(); }
      if (!o.org) return;   // template rows with only a part_id are empty, not errors
      if (o.part_id) o.part_id = resolveId(dev, o.part_id) || o.part_id;
      o.lat = num(o.lat); o.lon = num(o.lon); o.role = cap(o.role); o.status = cap(o.status);
      if (isFinite(o.lat) && isFinite(o.lon)) locations.push(o); else skipped++;
    });
  }
  return {parts, device, locations, skipped, hadLocations: !!ls};
}
async function loadFile(file){
  if (!file) return;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
    const {skipped, hadLocations, ...d} = parseBook(wb, cur);
    if (!hadLocations) d.locations = cur.builtin.locations;
    const when = new Date().toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
    DATA = d; loadedName = file.name; dataLabel = `Loaded from ${file.name} on ${when}. Stored in this browser only.`;
    try { localStorage.setItem(cur.storageKey, JSON.stringify({...d, _name:file.name, _when:when})); (cur.legacyKeys || []).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    const missing = Object.keys(P).filter(id => !d.parts.some(p => p.part_id === id));
    toast(`Loaded ${d.parts.length} parts and ${d.locations.length} locations from ${file.name}` + (skipped ? `. Skipped ${skipped} location rows without coordinates` : "") + (missing.length ? `. No row for: ${missing.join(", ")}` : ""));
    refresh();
  } catch (err) { toast(err.wrongSheet ? err.message : "Could not read that file. " + err.message); }
}
function resetData(){ DATA = cur.builtin; loadedName = null; dataLabel = BUILTIN_LABEL; try { localStorage.removeItem(cur.storageKey); (cur.legacyKeys || []).forEach(k => localStorage.removeItem(k)); } catch (e) {} toast("Back to the built-in draft"); refresh(); }
function refresh(){ buildLabels(); applyLook(); if (tour !== null) { const s = STEPS[tour]; s.panel ? renderPart(s.panel) : renderOverview(); } else if (selected && byId()[selected]) renderPart(selected); else { selected = null; renderOverview(); } }
$("#file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")){ dragDepth++; $("#drop").hidden = false; } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) $("#drop").hidden = true; });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#drop").hidden = true; loadFile(e.dataTransfer.files[0]); });

/* ---------- resizable side panel ---------- */
const work = $(".work"), split = $("#split"), SIDE_DEF = 400, SIDE_MIN = 300;
let sideW = SIDE_DEF; try { sideW = +localStorage.getItem("gyro-side-w") || SIDE_DEF; } catch (e) {}
const sideMax = () => Math.max(SIDE_MIN, work.clientWidth - 16 - 320);
function setSide(w, save){
  sideW = clamp(Math.round(w), SIDE_MIN, sideMax());
  work.style.setProperty("--side-w", sideW + "px");
  split.setAttribute("aria-valuenow", sideW); split.setAttribute("aria-valuemax", sideMax());
  if (save) try { localStorage.setItem("gyro-side-w", sideW); } catch (e) {}
}
function animateSide(to){
  if (reduce) return setSide(to, true);
  const from = sideW, t0 = performance.now();
  const st = now => { const k = Math.min(1, (now - t0)/340), e = 1 - Math.pow(1 - k, 3); setSide(from + (to - from)*e, k === 1); if (k < 1) requestAnimationFrame(st); };
  requestAnimationFrame(st);
}
split.addEventListener("pointerdown", e => {
  e.preventDefault(); split.setPointerCapture(e.pointerId); split.classList.add("on"); document.body.classList.add("resizing");
  const right = work.getBoundingClientRect().right, off = right - e.clientX - sideW;
  const move = ev => setSide(right - ev.clientX - off);
  const up = () => { split.removeEventListener("pointermove", move); split.removeEventListener("pointerup", up); split.removeEventListener("pointercancel", up);
    split.classList.remove("on"); document.body.classList.remove("resizing"); setSide(sideW, true); };
  split.addEventListener("pointermove", move); split.addEventListener("pointerup", up); split.addEventListener("pointercancel", up);
});
// double-click (or Enter) switches between a wide reading panel and the default width
const toggleSide = () => { const wide = Math.max(SIDE_DEF + 120, Math.round(work.clientWidth*.56)); animateSide(sideW < wide - 30 ? wide : SIDE_DEF); };
split.addEventListener("dblclick", toggleSide);
split.addEventListener("keydown", e => {
  const k = {ArrowLeft:40, ArrowRight:-40}[e.key];
  if (k){ e.preventDefault(); setSide(sideW + k, true); }
  else if (e.key === "Home"){ e.preventDefault(); animateSide(sideMax()); }
  else if (e.key === "End"){ e.preventDefault(); animateSide(SIDE_MIN); }
  else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleSide(); }
});
addEventListener("resize", () => setSide(sideW));
setSide(sideW);

document.querySelectorAll(".seg [data-dev]").forEach(b => b.addEventListener("click", () => switchDevice(b.dataset.dev)));
for (const d of Object.values(DEV)) d.root.visible = false;
useDevice(/^#(maser|fem)$/i.test(location.hash) ? DEV.fem : DEV.gyrotron);
requestAnimationFrame(frame);
</script>
